# =============================================================================
# Fly.io configuration — Swimly Web Application
# Deploy with: fly deploy --config apps/web/fly.toml
# =============================================================================

app = "swimly-web"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile.prod"
  # The Dockerfile expects to run from the monorepo root so that COPY
  # instructions can reach workspace config, shared packages, etc.
  [build.args]
    NEXT_PUBLIC_API_URL = "https://swimly-membership.fly.dev"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  NEXT_PUBLIC_API_URL = "https://swimly-membership.fly.dev"

[[services]]
  internal_port = 3000
  protocol = "tcp"
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

  [[services.http_checks]]
    interval = 15000
    grace_period = "10s"
    method = "GET"
    path = "/"
    protocol = "http"
    timeout = 5000

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  count = 1

[machines]
  auto_destroy = true

# Auto-scaling: min 1, max 2 instances
[autoscale]
  min_count = 1
  max_count = 2
