# =============================================================================
# Fly.io configuration — Swimly Membership Service
# Deploy with: fly deploy --config services/membership/fly.toml
# =============================================================================

app = "swimly-membership"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile.prod"
  # The Dockerfile expects to run from the monorepo root so that COPY
  # instructions can reach workspace config, shared packages, etc.

[env]
  NODE_ENV = "production"
  PORT = "3001"

# Secrets (set via `fly secrets set` — never commit real values):
#   DATABASE_URL          — Fly Postgres connection string
#   JWT_SECRET            — signing key for authentication tokens
#   NEXTAUTH_SECRET       — NextAuth.js session secret
#   GOCARDLESS_ACCESS_TOKEN
#   GOCARDLESS_ENVIRONMENT
#   GOCARDLESS_WEBHOOK_SECRET
#   CORS_ORIGINS          — allowed origins (e.g. https://swimly-web.fly.dev)

[[services]]
  internal_port = 3001
  protocol = "tcp"
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

  [[services.http_checks]]
    interval = 15000
    grace_period = "15s"
    method = "GET"
    path = "/api/health"
    protocol = "http"
    timeout = 5000

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  count = 1

[machines]
  auto_destroy = true

# Auto-scaling: min 1, max 2 instances
[autoscale]
  min_count = 1
  max_count = 2
