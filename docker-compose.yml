# =============================================================================
# Swimly - Docker Compose (Local Development)
# Runs PostgreSQL, existing services (membership, notifications), and web app.
# Usage: docker compose up
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # Primary data store for all Swimly services.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: swimly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-swim_nexus_dev}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - swimly-network
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-swim_nexus_dev}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Membership Service (port 3001)
  # Handles swimmers, families, squads, sessions, attendance, and auth.
  # ---------------------------------------------------------------------------
  membership:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        SERVICE_NAME: membership
    container_name: swimly-membership
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-swim_nexus_dev}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-not-for-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      EMAIL_HOST: ${EMAIL_HOST:-localhost}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-dev@localhost}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    volumes:
      - ./services/membership/src:/app/services/membership/src
      - ./packages:/app/packages
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - swimly-network
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3001/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Notifications Service (port 3005)
  # Handles emails, notifications, and messaging.
  # ---------------------------------------------------------------------------
  notifications:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        SERVICE_NAME: notifications
    container_name: swimly-notifications
    restart: unless-stopped
    ports:
      - '3005:3005'
    environment:
      NODE_ENV: development
      PORT: 3005
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-swim_nexus_dev}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-not-for-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      EMAIL_HOST: ${EMAIL_HOST:-localhost}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-dev@localhost}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    volumes:
      - ./services/notifications/src:/app/services/notifications/src
      - ./services/notifications/templates:/app/services/notifications/templates
      - ./packages:/app/packages
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - swimly-network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3005/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Next.js Web Application (port 3000)
  # The main frontend for coaches, parents, and administrators.
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    container_name: swimly-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-nextauth-secret-not-for-production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      MEMBERSHIP_API_URL: ${MEMBERSHIP_API_URL:-http://membership:3001}
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./packages:/app/packages
    depends_on:
      membership:
        condition: service_healthy
    networks:
      - swimly-network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  postgres-data:
    driver: local

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  swimly-network:
    driver: bridge
