name: Deploy marketing site

# Builds the Astro marketing site once and deploys it to both swimly.uk and
# swimly.club via FTP whenever marketing-site changes land on main. It reuses
# marketing-site/deploy-ftp.sh, which builds a single time and then splits that
# one build across the two document roots, so the critical file-permission fix
# (755 directories, 644 files) and the slim .htaccess files are applied to both
# targets exactly as in a local deploy. Bypassing that script has caused 403
# outages, so the workflow calls it rather than running lftp directly.
#
# Credentials and targets come from repo secrets:
#   FTP_HOST, FTP_USER, FTP_PASS  - the shared FTP account (swimly.uk; required)
#   FTP_CLUB_HOST/USER/PASS       - swimly.club's own FTP account, when it is a
#                                   separate login. When set, swimly.club deploys
#                                   with these and FTP_REMOTE_CLUB is the path on
#                                   that account (default "/").
#   FTP_REMOTE_CLUB               - swimly.club document root. On a dedicated
#                                   account it defaults to "/"; on the shared
#                                   account it must be a non-root path or the
#                                   swimly.club upload is skipped (the UK deploy
#                                   is never blocked).
#   FTP_REMOTE_INFO               - optional swimly.info redirect document root
# All of these must be configured in repo settings
# (Settings, Secrets and variables, Actions) for the matching target to deploy.

on:
  push:
    branches:
      - main
    paths:
      - 'marketing-site/**'
  workflow_dispatch: {}

# Never let two deploys run at once and corrupt the incremental manifest or the
# remote tree. Queue them instead of cancelling, so every merge reaches the site.
concurrency:
  group: deploy-marketing
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to swimly.uk and swimly.club
    runs-on: ubuntu-latest
    # Defined at job level so the failure step's `if` can read it. The Slack
    # alert is optional: if SLACK_DEPLOY_WEBHOOK is unset, the step is skipped.
    env:
      SLACK_DEPLOY_WEBHOOK: ${{ secrets.SLACK_DEPLOY_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: marketing-site/package-lock.json

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Install dependencies
        working-directory: marketing-site
        run: npm ci

      # Persist the incremental-deploy manifest (swimly.uk only) between runs so
      # each deploy only uploads changed and removed UK files. On a cache miss the
      # script safely falls back to uploading the whole UK site, which is the
      # correct first-run behaviour. The swimly.club target is not incremental.
      - name: Restore deploy manifest
        uses: actions/cache@v4
        with:
          path: marketing-site/.deploy-manifest
          key: deploy-manifest-${{ github.sha }}
          restore-keys: |
            deploy-manifest-

      # One invocation builds once and deploys both targets. FTP_REMOTE_CLUB and
      # FTP_REMOTE_INFO must be set as repo secrets for the swimly.club and
      # swimly.info targets to deploy; when a secret is empty the script skips
      # that target without failing, so swimly.uk always deploys.
      - name: Build and deploy
        working-directory: marketing-site
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_REMOTE_CLUB: ${{ secrets.FTP_REMOTE_CLUB }}
          FTP_REMOTE_INFO: ${{ secrets.FTP_REMOTE_INFO }}
          # swimly.club's own FTP account (set these when it is a separate login).
          FTP_CLUB_HOST: ${{ secrets.FTP_CLUB_HOST }}
          FTP_CLUB_USER: ${{ secrets.FTP_CLUB_USER }}
          FTP_CLUB_PASS: ${{ secrets.FTP_CLUB_PASS }}
        run: ./deploy-ftp.sh

      # Alert on a failed deploy so a broken site is noticed quickly. GitHub also
      # emails the actor on failure; this adds a team-visible Slack message. Skips
      # itself when no webhook is configured, so the workflow works without it.
      - name: Notify Slack on failure
        if: ${{ failure() && env.SLACK_DEPLOY_WEBHOOK != '' }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          msg="Marketing site deploy (swimly.uk / swimly.club) failed on ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). View the run: ${run_url}"
          curl -fsS -X POST "$SLACK_DEPLOY_WEBHOOK" \
            -H 'Content-Type: application/json' \
            --data "$(printf '{"text":"%s"}' "$msg")"
