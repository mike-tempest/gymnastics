name: Site health monitor

# Runs the live, read-only site-health monitor against the deployed Swimly
# domains (swimly.uk and swimly.club, plus the swimly.info forwarder) so any
# regression on either domain is caught automatically. The monitor performs
# HTTP checks only: it never builds or deploys anything.
#
# Triggers: a daily schedule and manual workflow_dispatch.
#
# On failure it posts a Slack alert IF the SLACK_DEPLOY_WEBHOOK secret is set,
# mirroring deploy-marketing.yml. When the secret is unset the alert step is
# skipped and the workflow still reports the failure (GitHub also emails the
# actor on a failed run).

on:
  schedule:
    # Daily at 06:30 UTC. Cron in GitHub Actions is always UTC.
    - cron: '30 6 * * *'
  workflow_dispatch: {}

# Only one health run at a time; queue rather than cancel so a manual run never
# silently drops a scheduled one.
concurrency:
  group: site-health
  cancel-in-progress: false

jobs:
  health:
    name: Live site-health checks
    runs-on: ubuntu-latest
    # Defined at job level so the failure step's `if` can read it. The Slack
    # alert is optional: if SLACK_DEPLOY_WEBHOOK is unset, the step is skipped.
    env:
      SLACK_DEPLOY_WEBHOOK: ${{ secrets.SLACK_DEPLOY_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Read-only live checks. No install step: the monitor uses Node built-ins
      # only (global fetch on Node 20). This job must never build or deploy.
      - name: Run site-health monitor
        run: node marketing-site/scripts/health-monitor.mjs

      # Alert on a failed health run so a broken site is noticed quickly. Skips
      # itself when no webhook is configured, so the workflow works without it.
      - name: Notify Slack on failure
        if: ${{ failure() && env.SLACK_DEPLOY_WEBHOOK != '' }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          msg="Swimly site-health monitor failed (swimly.uk / swimly.club) on ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). View the run: ${run_url}"
          curl -fsS -X POST "$SLACK_DEPLOY_WEBHOOK" \
            -H 'Content-Type: application/json' \
            --data "$(printf '{"text":"%s"}' "$msg")"
