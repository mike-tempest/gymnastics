name: Production images

on:
  pull_request:
    paths:
      - '**/Dockerfile*'
      - '.dockerignore'
      - 'marketing-site/**'
      - 'apps/web/src/lib/brand.ts'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/production-images.yml'
  push:
    branches: [main]
    paths:
      - '**/Dockerfile*'
      - '.dockerignore'
      - 'marketing-site/**'
      - 'apps/web/src/lib/brand.ts'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/production-images.yml'

permissions:
  contents: read

jobs:
  build-image:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: membership
            dockerfile: services/membership/Dockerfile.prod
          - service: web
            dockerfile: apps/web/Dockerfile
          - service: marketing
            dockerfile: marketing-site/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
